# XcodeGen manifest for the iOS app shell.
# Regenerate the project with: cd ios && xcodegen generate
name: TinglanIOS
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  TinglanIOSPackage:
    path: TinglanIOSPackage
targets:
  TinglanIOS:
    type: application
    platform: iOS
    sources:
      - TinglanIOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: TinglanIOSPackage
        product: TinglanIOSFeature
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/TinglanIOS.entitlements
        ENABLE_PREVIEWS: YES
  TinglanIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TinglanIOSUITests
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
    dependencies:
      - target: TinglanIOS
schemes:
  TinglanIOS:
    build:
      targets:
        TinglanIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TinglanIOSUITests
    archive:
      config: Release
