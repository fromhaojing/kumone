name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_NAME: 听澜
  SPARKLE_VERSION: "2.9.5"

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: build number = commit count

      - name: Derive version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          Scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          Scripts/release-notes.sh "$VERSION" --html > "$RUNNER_TEMP/$APP_NAME-$VERSION.html"
          echo "Release notes for $VERSION:"
          cat "$RUNNER_TEMP/notes.md"

      - name: Build app (universal)
        run: |
          MARKETING_VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" \
            ARCHES="arm64 x86_64" \
            Scripts/build-app.sh release

      - name: Verify Sparkle release key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Add the SPARKLE_PRIVATE_KEY repository secret before publishing a release."
            exit 1
          fi

      - name: Package and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent ".build/app/$APP_NAME.app" "dist/$APP_NAME-$VERSION.zip"
          cp "$RUNNER_TEMP/$APP_NAME-$VERSION.html" dist/

          curl -sL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
              --ed-key-file - \
              --embed-release-notes \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/" \
              -o dist/appcast.xml \
              dist
          rm -f "dist/$APP_NAME-$VERSION.html"
          cat dist/appcast.xml

      - name: Build unsigned iOS IPA
        run: |
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          mkdir -p "$RUNNER_TEMP/payload/Payload"
          cp -R "$APP" "$RUNNER_TEMP/payload/Payload/"
          (cd "$RUNNER_TEMP/payload" && zip -qry "$GITHUB_WORKSPACE/dist/$APP_NAME-iOS-$VERSION.ipa" Payload)
          ls -la dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$APP_NAME $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/$APP_NAME-$VERSION.zip" \
            "dist/$APP_NAME-iOS-$VERSION.ipa" \
            dist/appcast.xml
